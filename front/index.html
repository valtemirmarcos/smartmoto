    <!-- TOPO -->
    <header class="top-bar d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <!-- Botão hamburger mobile -->
        <button class="btn btn-outline-light d-md-none me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
        
        <img src="./imgs/5-copiar.png" alt="Smartmoto Logo" class="logo-img">
      </div>
      <div class="top-icons">
        <i class="bi bi-person-circle" title="Perfil"></i>
        <i class="bi bi-box-arrow-right logout-icon"
          title="Sair"
          data-bs-toggle="modal"
          data-bs-target="#modalLogout"
          >
        </i>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <div class="container-fluid flex-grow-1">
      <div class="row">

        <!-- MENU LATERAL -->
        <nav class="col-md-2 sidebar p-0 collapse d-md-block" id="sidebarMenu">
          <div class="username" id="usuario-logado">Carregando...</div>

        </nav>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="col-md-10 main-content">
          <div id="conteudo"></div>

        </main>

      </div>
    </div>

<!-- MODAL LOGOUT -->
<div 
    class="modal fade" 
    id="modalLogout"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">

            <!-- HEADER -->
            <div class="modal-header bg-dark text-white border-0">

                <h5 class="modal-title fw-bold">
                    Confirmar Saída
                </h5>

                <button 
                    type="button" 
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <!-- BODY -->
            <div class="modal-body text-center py-5">

                <div class="mb-4">

                    <i 
                        class="bi bi-box-arrow-right text-danger"
                        style="font-size: 70px;"
                    ></i>

                </div>

                <h4 class="fw-bold mb-3">
                    Deseja sair do sistema?
                </h4>

                <p class="text-muted mb-0">
                    Sua sessão será encerrada.
                </p>

            </div>

            <!-- FOOTER -->
            <div class="modal-footer border-0 justify-content-center pb-4">

                <!-- CANCELAR -->
                <button 
                    type="button"
                    class="btn btn-light border rounded-4 px-4"
                    data-bs-dismiss="modal"
                >

                    <i class="bi bi-x-circle me-1"></i>

                    Cancelar

                </button>

                <!-- SAIR -->
                <button 
                    type="button"
                    class="btn btn-danger rounded-4 px-4"
                    onclick="logout()"
                >

                    <i class="bi bi-box-arrow-right me-1"></i>

                    Sair

                </button>

            </div>

        </div>

    </div>

</div>

<div id="loadingModal" class="loading-modal">
  <div class="loading-content">
      <div class="spinner"></div>

      <i class="fas fa-motorcycle moto-icon"></i>

      <div class="loading-text">
          Gerando Semanais...
      </div>
  </div>
</div>

<!-- MODAL CONFIRMAÇÃO EXCLUSÃO -->
<div class="modal fade" id="modalExcluir" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">

  <div class="modal-dialog modal-dialog-centered modal-sm">

      <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">

          <!-- HEADER -->
          <div class="modal-header bg-danger text-white border-0">

              <h5 class="modal-title fw-bold">
                  Confirmar Exclusão
              </h5>

              <button 
                  type="button" 
                  class="btn-close btn-close-white"
                  data-bs-dismiss="modal"
              ></button>

          </div>

          <!-- BODY -->
          <div class="modal-body text-center py-4">

              <div class="mb-3">

                  <i class="bi bi-trash-fill text-danger" style="font-size: 60px;"></i>

              </div>

              <h6 class="fw-bold mb-2">
                  Deseja realmente excluir?
              </h6>

              <p class="text-muted small mb-0">
                  Esta ação poderá ser desfeita.
              </p>

          </div>

          <!-- FOOTER -->
          <div class="modal-footer border-0 justify-content-center pb-4">

              <button 
                  type="button"
                  class="btn btn-light border rounded-3 px-4"
                  data-bs-dismiss="modal"
              >
                  Cancelar
              </button>

              <button 
                  type="button"
                  class="btn btn-danger rounded-3 px-4"
                  id="btExcluir"
                  
              >
                  Excluir
              </button>

          </div>

      </div>

  </div>

</div>

    <!-- INICIAR ÚLTIMA PÁGINA -->
    <script>
      window.dadosUsuarioLogado = null;
      document.addEventListener("DOMContentLoaded", function () {
        const dadosUsuarioLogado = JSON.parse(localStorage.getItem("usuariologado"));
        window.dadosUsuarioLogado = dadosUsuarioLogado;
        console.log(dadosUsuarioLogado.nome);
        document.getElementById("usuario-logado").textContent = dadosUsuarioLogado.nome;
        if(dadosUsuarioLogado.tipoAcessoID == 1){
          mostrarMenuFranquia();
        }
        if(dadosUsuarioLogado.tipoAcessoID == 2){
          mostrarMenuFranqueado();
        }
          // pega última página salva
          let pagina = localStorage.getItem("paginaAtual");
  
          // padrão
          if (!pagina) {
              pagina = "dashboard";
          }
  
          carregarPagina(pagina);

  
      });
      </script>
